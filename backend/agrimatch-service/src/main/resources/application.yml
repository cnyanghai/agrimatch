server:
  port: 8080

spring:
  application:
    name: agrimatch-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wogu?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations:
        - classpath:db/agrimatch_core.sql
        - classpath:db/nht_product.sql
        - classpath:db/nht_product_parameters.sql
      continue-on-error: true

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'

logging:
  level:
    com.agrimatch: info

security:
  jwt:
    secret: ${JWT_SECRET:}

app:
  upload-dir: uploads
  filing-mode: false    # 备案审核期间改为 true

amap:
  # 高德地图：Web服务 Key（用于后端地理编码：地址->经纬度）
  web-key: ${AMAP_WEB_KEY:}
  # 高德地图：JS API Key（前端加载地图脚本用）
  js-key: ${AMAP_JS_KEY:}

wxpay:
  mch-id: ${WXPAY_MCH_ID:1106967009}
  app-id: ${WXPAY_APP_ID:wxf55c129266067a91}
  api-v3-key: ${WXPAY_API_V3_KEY:}
  cert-serial-no: ${WXPAY_CERT_SERIAL_NO:5877B7DA8ADABE2F7C65764F840028824BFAEAF7}
  private-key-path: ${WXPAY_PRIVATE_KEY_PATH:/opt/agrimatch/cert/apiclient_key.pem}
  public-key-path: ${WXPAY_PUBLIC_KEY_PATH:/opt/agrimatch/cert/pub_key.pem}
  public-key-id: ${WXPAY_PUBLIC_KEY_ID:PUB_KEY_ID_0111069670092026030400292262006400}
  notify-url: ${WXPAY_NOTIFY_URL:https://nongv1.com/api/pay/wechat/notify}

agrimatch:
  freight:
    # 运费单价（元/吨/公里），用于到厂价Beta：deliveredPrice = exFactoryPrice + distanceKm * rate
    rate-per-ton-km: 0.8

  # 短信服务配置
  sms:
    # 短信提供商：console（开发模式）| aliyun | tencent
    provider: ${SMS_PROVIDER:console}
    # 开发模式万能验证码（生产环境必须设为 false）
    dev-bypass: ${SMS_DEV_BYPASS:true}

    # 阿里云短信配置（provider=aliyun 时生效）
    aliyun:
      access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
      sign-name: 天津市东丽区农汇通网络
      template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
    
    # 腾讯云短信配置（provider=tencent 时生效）
    tencent:
      secret-id: ${TENCENT_SMS_SECRET_ID:}
      secret-key: ${TENCENT_SMS_SECRET_KEY:}
      app-id: ${TENCENT_SMS_APP_ID:}
      sign-name: 农汇通
      template-id: ${TENCENT_SMS_TEMPLATE_ID:}


